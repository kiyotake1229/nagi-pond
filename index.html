<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>凪の池</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="水面に触れて、波紋と音を楽しむ。鯉が育ち、蓮が咲く、静かな池のゲーム。">
<meta name="theme-color" content="#08151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="凪の池">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  /* Layout: full-bleed pond canvas. Vertical mincho type hangs like a scroll; one glass dock floats above the water. */
  --ink:#08151c;
  --paper:#ece6d3;
  --paper-2:rgba(236,230,211,.68);
  --paper-3:rgba(236,230,211,.4);
  --hair:rgba(236,230,211,.13);
  --glass:rgba(10,24,31,.46);
  --sheet:rgba(9,19,25,.93);
  --hi:#e8613c;
  --lotus:#f1b7c4;
  --moss:#8fb79a;
  --gold:#e3c07c;
  --display:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP",serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--paper-2);outline-offset:3px;border-radius:12px}
svg{display:block}
#pond{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;transition:opacity 1.6s var(--ease),transform 1s var(--ease)}
.hud>*{pointer-events:auto}
.sekki{writing-mode:vertical-rl;font-family:var(--display);font-size:15px;letter-spacing:.3em;color:var(--paper-2);line-height:1;display:flex;gap:8px;padding-top:4px;min-width:40px}
.sekki small{font-size:10px;letter-spacing:.18em;color:var(--paper-3)}
.buds{display:flex;gap:7px;padding:9px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.buds span{display:block;width:18px;height:18px;color:var(--paper-3);transition:color .8s,transform .8s var(--ease)}
.buds span svg{width:100%;height:100%}
.buds span.on{color:var(--lotus);transform:scale(1.15);animation:budpop .9s var(--ease)}
@keyframes budpop{0%{transform:scale(.6)}55%{transform:scale(1.45)}100%{transform:scale(1.15)}}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:40px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--hair);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .3s var(--ease),background .3s}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{transform:scale(.88)}
@media (hover:hover){.icon-btn:hover{background:rgba(236,230,211,.12)}}
.sleep-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--paper-2);padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);font-variant-numeric:tabular-nums}
.sleep-chip svg{width:12px;height:12px}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(var(--sb) + 16px);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:26px;background:var(--glass);border:1px solid var(--hair);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);z-index:5;transition:opacity 1.6s var(--ease),transform 1s var(--ease)}
.dock button{width:68px;padding:9px 0 7px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;letter-spacing:.12em;color:var(--paper-2);transition:background .3s,color .3s,transform .3s var(--ease)}
.dock button svg{width:22px;height:22px;transition:transform .5s var(--ease)}
.dock button:active{transform:scale(.92)}
@media (hover:hover){.dock button:hover{background:rgba(236,230,211,.09);color:var(--paper)}.dock button:hover svg{transform:translateY(-2px)}}
body.calm .hud,body.calm .dock{opacity:.3}
body.calm .dock:hover,body.calm .hud:hover{opacity:1}
body.intro .hud{opacity:0;transform:translateY(-14px);pointer-events:none}
body.intro .dock{opacity:0;transform:translate(-50%,18px);pointer-events:none}
body.breathing .dock,body.breathing .hud .buds{opacity:0;pointer-events:none}

/* ---------- title ---------- */
.title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:calc(var(--st) + 24px) 16px calc(var(--sb) + 28px);background:radial-gradient(120% 70% at 50% 45%,rgba(4,10,14,0) 0%,rgba(4,10,14,.35) 60%,rgba(4,10,14,.7) 100%);transition:opacity 1.4s var(--ease),filter 1.4s var(--ease),visibility 0s 1.4s;cursor:pointer}
.title.gone{opacity:0;filter:blur(8px);visibility:hidden;pointer-events:none}
.title-art{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:22px}
.title-name{margin:0;writing-mode:vertical-rl;font-family:var(--display);font-weight:600;font-size:clamp(46px,13vw,72px);letter-spacing:.32em;line-height:1;color:var(--paper);text-shadow:0 0 30px rgba(236,230,211,.25)}
.title-name span{display:inline-block;opacity:0;animation:rise 1.8s var(--ease) forwards}
.title-name span:nth-child(2){animation-delay:.35s}
.title-name span:nth-child(3){animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(-14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.title-sekki{margin:0;writing-mode:vertical-rl;font-family:var(--display);display:flex;gap:12px;padding-top:14px;opacity:0;animation:fade 2s 1.1s var(--ease) forwards}
.title-sekki b{font-weight:500;font-size:19px;letter-spacing:.3em;color:var(--paper)}
.title-sekki span{font-size:12px;letter-spacing:.25em;color:var(--paper-2)}
.title-sekki em{font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--paper-3)}
@keyframes fade{to{opacity:1}}
.start{position:relative;padding:15px 34px;border-radius:999px;font-family:var(--display);font-size:16px;letter-spacing:.32em;color:var(--paper);border:1px solid rgba(236,230,211,.35);background:rgba(236,230,211,.06);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;animation:fade 1.6s 1.6s var(--ease) forwards;transition:background .4s,transform .3s var(--ease)}
.start::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid rgba(236,230,211,.45);animation:halo 3.2s 2.4s ease-out infinite;opacity:0}
@keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35,1.6)}}
.start:active{transform:scale(.96)}
@media (hover:hover){.start:hover{background:rgba(236,230,211,.14)}}
.title-note{margin:0;font-size:11px;letter-spacing:.14em;color:var(--paper-3);text-align:center;line-height:1.8;opacity:0;animation:fade 1.6s 2.1s var(--ease) forwards}

/* ---------- hint / toast / big ---------- */
.hint{position:fixed;left:50%;bottom:calc(var(--sb) + 112px);transform:translate(-50%,8px);width:max-content;max-width:calc(100% - 32px);text-align:center;font-family:var(--display);font-size:15px;letter-spacing:.16em;line-height:1.7;color:var(--paper);text-shadow:0 1px 14px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity 1.2s var(--ease),transform 1.2s var(--ease);z-index:4}
.hint.show{opacity:1;transform:translate(-50%,0)}
.toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 70px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:15;padding:0 16px}
.toast{max-width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 20px;border-radius:18px;background:var(--sheet);border:1px solid var(--hair);box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;animation:tin .7s var(--ease)}
.toast b{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.1em}
.toast span{font-size:12px;color:var(--paper-2);letter-spacing:.06em}
.toast.out{animation:tout .7s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px) scale(.97)}}
.big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6}
.big span{writing-mode:vertical-rl;font-family:var(--display);font-size:clamp(54px,16vw,88px);letter-spacing:.5em;color:var(--paper);text-shadow:0 0 40px rgba(255,236,210,.55);opacity:0}
.big.show span{animation:bigin 4.6s var(--ease) forwards}
@keyframes bigin{0%{opacity:0;filter:blur(10px);transform:scale(.94)}22%{opacity:1;filter:blur(0);transform:none}75%{opacity:1;filter:blur(0);transform:none}100%{opacity:0;filter:blur(6px);transform:scale(1.03)}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,6,9,.45);opacity:0;pointer-events:none;transition:opacity .5s var(--ease);z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:84vh;max-height:min(84vh,84dvh);display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--hair);border-bottom:0;border-radius:26px 26px 0 0;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transform:translateY(105%);transition:transform .55s var(--ease);z-index:31;-webkit-user-select:text;user-select:text}
.sheet.open{transform:none}
.sheet-grip{width:38px;height:4px;border-radius:4px;background:var(--hair);margin:10px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px 22px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:.24em}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 22px calc(var(--sb) + 28px);overscroll-behavior:contain}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.24em;color:var(--paper-2)}
.sec small{font-family:var(--body);font-size:11px;letter-spacing:.08em;color:var(--paper-3)}
.lead{margin:6px 0 0;font-size:13px;line-height:1.9;color:var(--paper-2)}
.note{margin:8px 0 0;font-size:11.5px;line-height:1.7;color:var(--paper-3)}

/* records */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{padding:14px 16px;border-radius:16px;background:rgba(236,230,211,.045);border:1px solid var(--hair);display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:11px;letter-spacing:.16em;color:var(--paper-3)}
.stat .v{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--body);font-size:12px;color:var(--paper-2);margin:0 4px 0 2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:128px;padding:0 2px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.wk i{display:block;width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:rgba(143,183,154,.38);min-height:3px;transform-origin:bottom;animation:grow .9s var(--ease) both}
.wk.today i{background:var(--moss)}
.wk b{font-weight:400;font-size:10px;color:var(--paper-3);font-variant-numeric:tabular-nums;min-height:12px}
.wk span{font-family:var(--display);font-size:12px;color:var(--paper-2)}
.wk.today span{color:var(--paper)}
@keyframes grow{from{transform:scaleY(0)}}
.mini{margin-top:14px;font-size:12px;color:var(--paper-2);line-height:1.9;letter-spacing:.04em}
.unlocks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.unlocks li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:1px solid var(--hair)}
.unlocks li svg{width:18px;height:18px;flex:none;color:var(--paper-3)}
.unlocks li.got svg{color:var(--lotus)}
.unlocks .u{display:flex;flex-direction:column;gap:2px;min-width:0}
.unlocks .u b{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.14em}
.unlocks .u span{font-size:11.5px;color:var(--paper-3)}
.unlocks li.got .u span{color:var(--paper-2)}
.unlocks li:not(.got) .u b{color:var(--paper-3)}

/* zukan */
.zk-top{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.zk-top b{font-family:var(--display);font-weight:500;font-size:34px;font-variant-numeric:tabular-nums}
.zk-top span{font-size:12px;color:var(--paper-2);letter-spacing:.1em}
.pond-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pk{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 6px;border-radius:16px;background:rgba(236,230,211,.04);border:1px solid var(--hair)}
.pk canvas{width:96px;height:48px;flex:none}
.pk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pk-name{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:15px;letter-spacing:.1em}
.pk-name small{font-family:var(--body);font-size:10.5px;letter-spacing:.12em;color:var(--paper-2);padding:2px 8px;border-radius:999px;border:1px solid var(--hair)}
.bar{height:4px;border-radius:4px;background:rgba(236,230,211,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d9744f,#f0b48c);transform-origin:left;animation:barin 1s var(--ease) both}
@keyframes barin{from{transform:scaleX(0)}}
.pk-sub{font-size:11px;color:var(--paper-3);letter-spacing:.04em}
.zk-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.zk{padding:10px 12px 12px;border-radius:16px;border:1px solid var(--hair);background:rgba(236,230,211,.035);display:flex;flex-direction:column;gap:4px;min-width:0;animation:tin .6s var(--ease) both}
.zk canvas{width:100%;height:auto;aspect-ratio:2/1;max-width:100%}
.zk-name{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-family:var(--display);font-size:15px;letter-spacing:.08em}
.zk-name small{font-family:var(--body);font-size:10px;letter-spacing:.06em;color:var(--paper-3);white-space:nowrap}
.zk p{margin:2px 0 0;font-size:11px;line-height:1.65;color:var(--paper-2)}
.zk.unseen .zk-name{color:var(--paper-3)}
.rare{display:inline-flex;gap:3px}
.rare i{width:5px;height:5px;border-radius:50%;background:var(--paper-3)}
.rare i.on{background:var(--gold)}

/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row label,.row>span{font-size:14px;letter-spacing:.06em;display:flex;flex-direction:column;gap:2px}
.row small{font-size:11px;color:var(--paper-3);letter-spacing:.02em}
.sw{position:relative;width:50px;height:30px;border-radius:999px;background:rgba(236,230,211,.13);flex:none;transition:background .35s var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.sw[aria-checked="true"]{background:#5f8f74}
.sw[aria-checked="true"] i{transform:translateX(20px)}
.lock{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--paper-3);white-space:nowrap}
.lock svg{width:13px;height:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(52%,220px);height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(236,230,211,.2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);margin-top:-9px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(236,230,211,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--paper)}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(236,230,211,.06);border:1px solid var(--hair);gap:2px}
.seg button{flex:1;min-width:0;padding:9px 0;border-radius:10px;font-size:13px;letter-spacing:.08em;color:var(--paper-2);transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:rgba(236,230,211,.9);color:#0c1a21}
.danger{width:100%;padding:13px;border-radius:14px;border:1px solid rgba(232,97,60,.45);color:#f2a088;font-size:14px;letter-spacing:.1em;transition:background .3s}
.danger.armed{background:rgba(232,97,60,.85);color:#fff}
.about{margin:30px 0 0;font-size:11px;line-height:1.9;color:var(--paper-3);text-align:center}
.about a{display:inline-block;margin-top:6px;color:var(--paper-2);text-underline-offset:3px}

/* breath sheet */
.bp{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bp button{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--hair);background:rgba(236,230,211,.035);transition:border-color .3s,background .3s}
.bp button[aria-checked="true"]{border-color:rgba(236,230,211,.6);background:rgba(236,230,211,.09)}
.bp b{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.2em;min-width:5.4em}
.bp span{font-size:12px;color:var(--paper-2);line-height:1.6}
.primary{width:100%;margin-top:22px;padding:15px;border-radius:16px;background:var(--paper);color:#0c1a21;font-family:var(--display);font-size:16px;letter-spacing:.3em;transition:transform .3s var(--ease),opacity .3s}
.primary:active{transform:scale(.97)}

/* breath overlay */
.breath{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;visibility:hidden;transition:opacity 1.2s var(--ease),visibility 0s 1.2s}
.breath.show{opacity:1;visibility:visible;transition:opacity 1.2s var(--ease)}
.breath-mid{position:absolute;left:0;right:0;top:45%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 1px 18px rgba(0,0,0,.5)}
.breath-mid b{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:.4em;padding-left:.4em;transition:opacity .5s}
.breath-mid span{font-family:var(--display);font-size:15px;color:var(--paper-2);font-variant-numeric:tabular-nums;min-height:1.3em}
.breath-foot{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 26px);display:flex;align-items:center;justify-content:center;gap:16px}
.breath-foot span{font-size:13px;color:var(--paper-2);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.ghost{pointer-events:auto;padding:10px 22px;border-radius:999px;border:1px solid var(--hair);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13px;letter-spacing:.2em;color:var(--paper);transition:transform .3s var(--ease)}
.ghost:active{transform:scale(.95)}

/* sleep cover */
/* photo */
.shutter{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45}
.shutter.go{animation:shut .6s ease-out}
@keyframes shut{0%{opacity:.55}100%{opacity:0}}
.photo{position:fixed;inset:0;z-index:42;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(var(--st) + 20px) 16px calc(var(--sb) + 20px);background:rgba(2,6,9,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
.photo.show{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}
.photo img{display:block;max-width:100%;max-height:calc(100% - 120px);width:auto;height:auto;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.94);transition:transform .6s var(--ease);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}

<script>
'use strict';
(() => {
// ================= 小さな道具 =================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ================= 暦（二十四節気） =================
// [月, 日, 名前, 読み, 意味, 季節]  日付は年により1日ほど前後する
const SEKKI = [
  [1, 5, '小寒', 'しょうかん', '寒さが厳しくなるころ', 'winter'],
  [1, 20, '大寒', 'だいかん', '一年でいちばん寒いころ', 'winter'],
  [2, 4, '立春', 'りっしゅん', '暦の上で春がはじまる', 'spring'],
  [2, 19, '雨水', 'うすい', '雪が雨に変わるころ', 'spring'],
  [3, 5, '啓蟄', 'けいちつ', '虫が土から出てくるころ', 'spring'],
  [3, 20, '春分', 'しゅんぶん', '昼と夜が同じ長さになる', 'spring'],
  [4, 4, '清明', 'せいめい', 'すべてが清らかに明るいころ', 'spring'],
  [4, 20, '穀雨', 'こくう', '穀物をうるおす春の雨', 'spring'],
  [5, 5, '立夏', 'りっか', '暦の上で夏がはじまる', 'summer'],
  [5, 21, '小満', 'しょうまん', '草木が育ち満ちていくころ', 'summer'],
  [6, 5, '芒種', 'ぼうしゅ', '稲や麦の種をまくころ', 'summer'],
  [6, 21, '夏至', 'げし', '一年で昼がいちばん長い', 'summer'],
  [7, 7, '小暑', 'しょうしょ', '暑さが本格的になるころ', 'summer'],
  [7, 22, '大暑', 'たいしょ', '一年でいちばん暑いころ', 'summer'],
  [8, 7, '立秋', 'りっしゅう', '暦の上で秋がはじまる', 'autumn'],
  [8, 23, '処暑', 'しょしょ', '暑さがおさまるころ', 'autumn'],
  [9, 7, '白露', 'はくろ', '草に白い露が宿るころ', 'autumn'],
  [9, 23, '秋分', 'しゅうぶん', '昼と夜が同じ長さになる', 'autumn'],
  [10, 8, '寒露', 'かんろ', '冷たい露が降りるころ', 'autumn'],
  [10, 23, '霜降', 'そうこう', '霜が降りはじめるころ', 'autumn'],
  [11, 7, '立冬', 'りっとう', '暦の上で冬がはじまる', 'winter'],
  [11, 22, '小雪', 'しょうせつ', '雪がちらつきはじめるころ', 'winter'],
  [12, 7, '大雪', 'たいせつ', '雪が本格的に降るころ', 'winter'],
  [12, 22, '冬至', 'とうじ', '一年で夜がいちばん長い', 'winter'],
];
function sekkiNow(d = new Date()) {
  const m = d.getMonth() + 1, day = d.getDate();
  let cur = SEKKI[SEKKI.length - 1];
  for (const s of SEKKI) if (m > s[0] || (m === s[0] && day >= s[1])) cur = s;
  return { name: cur[2], yomi: cur[3], desc: cur[4], season: cur[5] };
}
const SEASON_NAME = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };

// ================= 景色 =================
const SCENES = {
  night: { name: '夜', top: '#0f2431', bot: '#040a0f', glow: '#f2ead0', gx: .72, gy: .2, ga: .55, rip: '#d6e6f0', ripS: '#000000', pad: '#1c3829', padHi: '#3f6a4c', fog: 0, dark: 1, key: 50, minor: true },
  dawn: { name: '朝', top: '#9db2bb', bot: '#4c6b78', glow: '#fff3da', gx: .28, gy: .15, ga: .6, rip: '#ffffff', ripS: '#28434f', pad: '#47704f', padHi: '#8db58a', fog: .6, dark: .1, key: 55, minor: false },
  day: { name: '昼', top: '#3b827d', bot: '#0f3533', glow: '#fffbe6', gx: .62, gy: .12, ga: .5, rip: '#eafcf6', ripS: '#05201f', pad: '#3c6c39', padHi: '#7fae68', fog: 0, dark: 0, key: 48, minor: false },
  dusk: { name: '夕', top: '#573559', bot: '#15112a', glow: '#ffb27a', gx: .26, gy: .22, ga: .65, rip: '#ffe2cf', ripS: '#120a1a', pad: '#2b392c', padHi: '#61724f', fog: 0, dark: .75, key: 45, minor: true },
};
const todNow = () => { const h = new Date().getHours(); return h >= 5 && h < 9 ? 'dawn' : h >= 9 && h < 16 ? 'day' : h >= 16 && h < 19 ? 'dusk' : 'night'; };

// ================= 鯉 =================
const KINDS = [
  { id: 'kohaku', name: '紅白', rare: 1, desc: '白地に緋色の模様。いちばん親しまれている鯉' },
  { id: 'sanke', name: '大正三色', rare: 1, desc: '紅白に、墨の小さな斑が入る' },
  { id: 'showa', name: '昭和三色', rare: 2, desc: '墨の地に緋と白。力強い模様' },
  { id: 'tancho', name: '丹頂', rare: 3, desc: '頭に丸い緋がひとつだけ。日の丸のよう' },
  { id: 'shiro', name: '白写り', rare: 1, desc: '白い地に、墨の大きな模様' },
  { id: 'hiutsuri', name: '緋写り', rare: 2, desc: '墨の地に、濃い緋の模様' },
  { id: 'asagi', name: '浅黄', rare: 2, desc: '藍色の網目に、脇の緋。古くからの品種' },
  { id: 'shusui', name: '秋翠', rare: 3, desc: '背に藍の鱗が一列に並ぶ、すっきりとした鯉' },
  { id: 'ogon', name: '黄金', rare: 2, desc: '全身が金色に光る' },
  { id: 'platinum', name: 'プラチナ', rare: 2, desc: '全身が白金色に光る' },
  { id: 'kujaku', name: '孔雀', rare: 3, desc: '光る肌に網目と緋。華やかな鯉' },
  { id: 'chagoi', name: '茶鯉', rare: 1, desc: '落ち着いた茶色。人によく慣れる' },
];
const KIND = Object.fromEntries(KINDS.map(k => [k.id, k]));
const RARE_LABEL = { 1: 'よく見る', 2: 'ときどき', 3: 'めずらしい' };
const STAGES = [[0, '稚魚'], [6, '若鯉'], [20, '成鯉'], [45, '大鯉']];
const stageOf = xp => { let s = 0; for (let i = 0; i < STAGES.length; i++) if (xp >= STAGES[i][0]) s = i; return s; };
const koiScale = xp => .5 + .62 * (1 - Math.exp(-xp / 22));
const VERSION = '1.1.0';
const SUPPORT_URL = 'https://kiyotake1229.github.io/nagi-pond/support.html';
const POND_MAX = 9;
const BLOOM_NEED = 4; // つぼみが開くのに必要な波紋の量

// 個体ごとの模様（種類と種から毎回同じ模様を作る）
function makeLook(kind, seed) {
  const r = mulberry(seed * 7919 + 17);
  const R = '#d8432a', B = '#18171b', O = '#e8783c', W = '#f6f2ea';
  const L = { base: W, fin: '#f1ece2', metal: false, net: null, spots: [] };
  const patch = (t, o, size, col, n = 5) => { for (let i = 0; i < n; i++) L.spots.push({ t: t + (r() - .5) * size * 1.5, o: o + (r() - .5) * size * 1.3, r: size * (.55 + r() * .5), c: col }); };
  const redPatches = (col = R) => {
    if (r() < .75) patch(.05 + r() * .06, (r() - .5) * .03, .05, col, 4);
    const n = 1 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) patch(.22 + (i / n) * .5 + r() * .12, (r() - .5) * .07, .045 + r() * .02, col, 5);
  };
  switch (kind) {
    case 'kohaku': redPatches(); break;
    case 'sanke': redPatches(); for (let i = 0, n = 4 + Math.floor(r() * 4); i < n; i++) L.spots.push({ t: .2 + r() * .55, o: (r() - .5) * .2, r: .014 + r() * .016, c: B }); break;
    case 'showa': L.base = B; L.fin = '#2d2a2c'; redPatches(); for (let i = 0; i < 3; i++) patch(.1 + r() * .65, (r() - .5) * .12, .04, W, 3); break;
    case 'tancho': L.spots.push({ t: .085, o: 0, r: .048, c: R }); break;
    case 'shiro': L.fin = '#eeeae2'; patch(.05, (r() - .5) * .04, .035, B, 3); for (let i = 0; i < 3; i++) patch(.25 + i * .19 + r() * .08, (r() - .5) * .14, .05, B, 4); break;
    case 'hiutsuri': L.base = B; L.fin = '#3a2a26'; for (let i = 0; i < 4; i++) patch(.06 + i * .19 + r() * .07, (r() - .5) * .12, .055, '#e05a2e', 5); break;
    case 'asagi': L.base = '#7c97ab'; L.fin = '#e6875c'; L.net = 'rgba(200,216,226,.55)'; for (let i = 0; i < 6; i++) { const t = .06 + i * .12; L.spots.push({ t, o: .115, r: .045, c: '#e06a3d' }, { t, o: -.115, r: .045, c: '#e06a3d' }); } break;
    case 'shusui': L.base = '#a8bfcc'; L.fin = '#ec8d5c'; for (let t = .14; t < .82; t += .065) L.spots.push({ t, o: .022, r: .015, c: '#2e4b6c' }, { t: t + .03, o: -.022, r: .015, c: '#2e4b6c' }); for (let i = 0; i < 5; i++) { const t = .1 + i * .13; L.spots.push({ t, o: .12, r: .04, c: '#e8793f' }, { t, o: -.12, r: .04, c: '#e8793f' }); } break;
    case 'ogon': L.base = '#e5b447'; L.fin = '#efc766'; L.metal = true; break;
    case 'platinum': L.base = '#e3e6e7'; L.fin = '#eef0f0'; L.metal = true; break;
    case 'kujaku': L.base = '#eceeec'; L.fin = '#f0e6dc'; L.metal = true; L.net = 'rgba(110,128,142,.55)'; for (let i = 0; i < 3; i++) patch(.1 + i * .22 + r() * .08, (r() - .5) * .1, .045, '#ea7a3c', 4); break;
    case 'chagoi': L.base = '#8a6a49'; L.fin = '#9a7a57'; L.net = 'rgba(70,50,32,.55)'; break;
  }
  return L;
}

// ================= 蓮・しつらえ =================
const LOTUS = {
  pink: { name: '薄紅', a: '#f8d6de', b: '#ef9fb4', c: '#df7b97' },
  white: { name: '白蓮', a: '#fdfaf2', b: '#f0e8da', c: '#dccfb8' },
  yellow: { name: '黄蓮', a: '#fcf0c2', b: '#f2d77e', c: '#e0b64c' },
  blue: { name: '青蓮', a: '#e2e9fb', b: '#aabef0', c: '#7d95da' },
  purple: { name: '紫蓮', a: '#f1e2fa', b: '#d0afea', c: '#a884ce' },
};
const UNLOCKS = [
  { at: 2, key: 'white', name: '白蓮', desc: '白い蓮も咲くようになります' },
  { at: 4, key: 'shishi', name: '鹿威し', desc: 'ときどき、竹の音が響きます' },
  { at: 6, key: 'yellow', name: '黄蓮', desc: '黄色い蓮も咲くようになります' },
  { at: 9, key: 'blue', name: '青蓮', desc: '青い蓮も咲くようになります' },

  { at: 16, key: 'purple', name: '紫蓮', desc: '紫の蓮も咲くようになります' },
];
const BREATH = {
  totonou: { name: 'ととのう', sub: '5秒吸って、5秒吐く', steps: [['in', 5], ['out', 5]] },
  nemuru: { name: 'ねむる', sub: '4秒吸って、7秒とめて、8秒吐く', steps: [['in', 4], ['hold', 7], ['out', 8]] },
  shizumeru: { name: 'しずめる', sub: '4秒ずつ、吸う・とめる・吐く・とめる', steps: [['in', 4], ['hold', 4], ['out', 4], ['rest', 4]] },
};
const PHASE_LABEL = { in: '吸う', hold: 'とめる', out: '吐く', rest: 'とめる' };

// ================= ネイティブ（iOS アプリ版）との橋渡し。Web版ではすべて使わない =================
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const CAP = (window.Capacitor && window.Capacitor.Plugins) || {};

// ================= 保存 =================
const KEY = 'nagi.v1';
const fresh = () => ({
  v: 1, created: Date.now(), nextId: 1, koi: [], seen: {}, blooms: 0, fulls: 0, days: {}, breaths: 0, breathSec: 0, hint: 0,
  set: { bgm: true, sfx: true, vib: true, vol: .75, mute: false, scene: 'auto', season: 'auto', shishi: true, lantern: true, bp: 'totonou', blen: 3, notify: false, notifyHour: 21 },
});
function load() {
  const d = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        Object.assign(d, o);
        d.set = Object.assign(fresh().set, o.set || {});
        if (!Array.isArray(d.koi)) d.koi = [];
        d.koi = d.koi.filter(k => k && KIND[k.kind]);
        if (!d.seen || typeof d.seen !== 'object') d.seen = {};
        if (!d.days || typeof d.days !== 'object') d.days = {};
      }
    }
  } catch (e) { /* 読めなければ初期状態で始める */ }
  // 70日より前の記録は消す

let nextDrop = 4, nextShishi = 30, nextFall = 2, sceneCheck = 0;

    } else if (a.type === 'fall') {

let breath = null;
function breathStart() {

  breath = { pat, total: S.set.blen * 60, el: 0, step: 0, st: 0, r: U * .14, showT: 0, ending: false };
  document.body.classList.add('breathing');
  $('breath').classList.add('show');

  requestWake();
}
function phaseCue(ph) {
  const key = scene().key;

  else if (ph === 'out') { bell(key + 19, { vel: .09, dur: 5 }); addRipple(W / 2, H * .45, { power: .5, R: U * .62, life: 6, a: .7 }); }
  else bell(key + 31, { vel: .04, dur: 2.5 });
  buzz('light');
}
function breathUpdate(dt) {
  if (!breath) return;
  const b = breath, steps = b.pat.steps;
  if (b.ending) { b.showT -= dt; if (b.showT <= 0) breath = null; return; }
  b.showT = Math.min(1, b.showT + dt);
  b.el += dt; b.st += dt;
  if (b.st >= steps[b.step][1]) {
    b.st -= steps[b.step][1];
    b.step = (b.step + 1) % steps.length;

    phaseCue(steps[b.step][0]);

  b.r = ph === 'in' ? lerp(rMin, rMax, k) : ph === 'out' ? lerp(rMax, rMin, k) : ph === 'hold' ? rMax : rMin;
  breathUI();
}
function breathUI() {
  if (!breath || breath.ending) return;
  const b = breath, [ph, len] = b.pat.steps[b.step];
  const lab = PHASE_LABEL[ph];
  if ($('bPhase').textContent !== lab) $('bPhase').textContent = lab;
  const cnt = String(Math.max(1, Math.ceil(len - b.st)));
  if ($('bCount').textContent !== cnt) $('bCount').textContent = cnt;
  const left = Math.max(0, Math.ceil(b.total - b.el)), txt = `のこり ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if ($('bLeft').textContent !== txt) $('bLeft').textContent = txt;
}
function breathDraw() {
  if (!breath) return;
  const b = breath, a = clamp(b.showT, 0, 1), x = W / 2, y = H * .45;
  drawGlow(P.glow, x, y, b.r * 1.5, .12 * a);

}
function breathFinish(done) {

const MINCHO = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif';
let photoCanvas = null;
function takePhoto() {
  audioStart();
  // シャッターの音（短い紙の音）
  if (A.ready) noiseHit(A.ctx.currentTime, { type: 'highpass', freq: 2500, vel: .08, dur: .07 });
  const sh = $('shutter'); sh.classList.remove('go'); void sh.offsetWidth; sh.classList.add('go');
  buzz('medium');
  const OW = 1080, OH = 1350, k = document.createElement('canvas'); k.width = OW; k.height = OH;
  const x = k.getContext('2d');
  // 池の今の絵を、縦長（4:5）に切り抜いて敷く
  const sw = cv.width, sh2 = cv.height, sc = Math.max(OW / sw, OH / sh2), dw = sw * sc, dh = sh2 * sc;
  x.drawImage(cv, (OW - dw) / 2, (OH - dh) / 2, dw, dh);
  const g = x.createLinearGradient(0, OH * .58, 0, OH);
  g.addColorStop(0, 'rgba(4,10,14,0)'); g.addColorStop(1, 'rgba(4,10,14,.86)');
  x.fillStyle = g; x.fillRect(0, 0, OW, OH);
  const tg = x.createLinearGradient(0, 0, 0, OH * .22);
  tg.addColorStop(0, 'rgba(4,10,14,.45)'); tg.addColorStop(1, 'rgba(4,10,14,0)');
  x.fillStyle = tg; x.fillRect(0, 0, OW, OH * .22);
  // 右上に節気を縦書き
  const sk = sekkiNow();
  x.fillStyle = 'rgba(236,230,211,.9)'; x.font = `500 50px ${MINCHO}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  [...sk.name].forEach((ch, i) => x.fillText(ch, OW - 84, 104 + i * 64));
  x.fillStyle = 'rgba(236,230,211,.55)'; x.font = `22px ${MINCHO}`;
  [...sk.yomi].forEach((ch, i) => x.fillText(ch, OW - 140, 92 + i * 30));
  // 下に題と記録
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillStyle = '#ece6d3'; x.font = `600 76px ${MINCHO}`;
  if ('letterSpacing' in x) x.letterSpacing = '14px';
  x.fillText('凪の池', 76, OH - 186);
  if ('letterSpacing' in x) x.letterSpacing = '3px';
  const d = new Date();
  x.fillStyle = 'rgba(236,230,211,.78)'; x.font = `28px ${MINCHO}`;
  x.fillText(`${sk.name}のころ　${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`, 80, OH - 124);
  x.fillStyle = 'rgba(236,230,211,.6)'; x.font = `24px ${MINCHO}`;
  const seenN = KINDS.filter(q => S.seen[q.id]).length;
  x.fillText(`鯉 ${S.koi.length}匹　満開 ${S.fulls}回　図鑑 ${seenN}/${KINDS.length}`, 80, OH - 78);
  if ('letterSpacing' in x) x.letterSpacing = '0px';
  x.strokeStyle = 'rgba(236,230,211,.22)'; x.lineWidth = 2; x.strokeRect(36, 36, OW - 72, OH - 72);
  photoCanvas = k;
  $('photoImg').src = k.toDataURL('image/jpeg', .9);
  $('photoNote').textContent = NATIVE ? '共有から写真に保存することもできます' : '画像を長押しすると保存できます';
  setTimeout(() => $('photo').classList.add('show'), 260);
}
async function sharePhoto() {

      const b64 = photoCanvas.toDataURL('image/jpeg', .9).split(',')[1];

    const f = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: '凪の池' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }

// ================= 夜のお知らせ（iOS アプリ版のみ。端末の中で予約するローカル通知） =================
const NOTIFY_LINES = {
  spring: ['池に桜の花びらが浮かんでいます', '春の夜の池で、鯉が待っています'],
  summer: ['池のまわりに蛍が飛んでいます', '夏の夜風に、水面がゆれています'],
  autumn: ['池にもみじが浮かんでいます', '虫の声のする池で、ひと息つきませんか'],
  winter: ['池に雪が舞っています', '冬の静かな池で、ひと息つきませんか'],
};
const NOTIFY_BASE = 7000, NOTIFY_DAYS = 14;
async function cancelNotify() {
  if (!(NATIVE && CAP.LocalNotifications)) return;
  try { await CAP.LocalNotifications.cancel({ notifications: Array.from({ length: NOTIFY_DAYS }, (_, i) => ({ id: NOTIFY_BASE + i })) }); } catch (e) {}
}
// 先の14日分を、日ごとの節気に合わせた文面で予約しなおす（開くたびに補充される）
async function scheduleNotify() {
  if (!(NATIVE && CAP.LocalNotifications)) return;
  await cancelNotify();
  if (!S.set.notify) return;
  const list = [], now = Date.now();
  for (let i = 0; i < NOTIFY_DAYS + 1 && list.length < NOTIFY_DAYS; i++) {
    const at = new Date(); at.setDate(at.getDate() + i); at.setHours(S.set.notifyHour, 0, 0, 0);
    if (at.getTime() < now + 60000) continue;
    const sk = sekkiNow(at), lines = NOTIFY_LINES[sk.season];
    list.push({ id: NOTIFY_BASE + list.length, title: '凪の池', body: `${sk.name}のころ。${lines[(at.getDate() + i) % lines.length]}`, schedule: { at, allowWhileIdle: true } });
  }
  try { await CAP.LocalNotifications.schedule({ notifications: list }); } catch (e) {}
}
async function toggleNotify() {
  if (!(NATIVE && CAP.LocalNotifications)) return;
  if (!S.set.notify) {
    let ok = false;
    try { const p = await CAP.LocalNotifications.requestPermissions(); ok = p.display === 'granted'; } catch (e) {}
    if (!ok) { toast('通知が許可されていません', 'iPhoneの「設定」→「通知」→「凪の池」で許可できます'); renderSheet(); return; }
    S.set.notify = true; toast('毎晩お知らせします', `${S.set.notifyHour}時ごろに届きます`);
  } else { S.set.notify = false; }
  save(); await scheduleNotify(); renderSheet();
}

// ================= はじまり =================
function start() {
  if (started) return;
  started = true;
  audioStart();
  $('title').classList.add('gone');
  document.body.classList.remove('intro');
  addRipple(W / 2, H * .5, { power: 0, R: U * .7, life: 5 });
  bell(scene().key + 24, { vel: .14, dur: 4 }); bell(scene().key + 31, { vel: .08, dur: 4, when: .25 });
  if (S.hint === 0) setTimeout(() => showHint('水面に、そっと触れてください'), 1400);
  else if (S.hint === 1) setTimeout(() => showHint('波紋がつぼみに届くと、蓮がひらきます', 6), 1400);
  poke();
}
$('title').addEventListener('click', start);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); if (A.ready) A.ctx.suspend().catch(() => {}); }
  else { if (A.ready && started && !sleeping) A.ctx.resume().catch(() => {}); last = performance.now(); if (breath) requestWake(); }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { resize(); });

document.body.classList.add('intro');
resize();
for (const d of S.koi) koi.push(new Koi(d));
rebuildSeason();
buildLanterns();
newRound();
renderSekki();
renderMute();
if (NATIVE) {
  restoreNative();
  if (CAP.StatusBar) { try { CAP.StatusBar.setStyle({ style: 'DARK' }); } catch (e) {} }
  if (S.set.notify) scheduleNotify();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// オフラインで起動できるようにする（通常のWeb公開時のみ）
try {
  const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!native && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
} catch (e) { /* 使えない環境では何もしない */ }

// テスト用の窓口
window.__nagi = { get S() { return S; }, koi, pads, ripples, pellets, start, tapAt, celebrate, openSheet, closeSheet, takePhoto, closePhoto, breathStart, get round() { return round; } };
})();
