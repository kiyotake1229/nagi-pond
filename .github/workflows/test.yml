# 自動テスト（tools/test.mjs）。index.html やテストを変えて push するたびに走る
name: test
on:
  push:
    paths: ["index.html", "tools/test.mjs", ".github/workflows/test.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/test.mjs
